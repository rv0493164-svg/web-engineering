<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:red;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:700px;
    background:#fff;
    padding:30px;
    border-radius:5px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.row{
    display:flex;
    gap:20px;
    margin-bottom:20px;
}

.input-box{
    width:100%;
}

.input-box label{
    display:block;
    margin-bottom:8px;
    font-size:16px;
}

.input-box input,
.input-box select,
.input-box textarea{
    width:100%;
    padding:10px;
    border:1px solid #555;
    border-radius:4px;
    font-size:15px;
}

textarea{
    resize:none;
}

.gender,
.branch{
    display:flex;
    gap:15px;
    margin-top:10px;
}

button{
    width:100%;
    padding:12px;
    background:red;
    color:white;
    border:none;
    border-radius:4px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:darkred;
}
</style>

</head>
<body>

<div class="container">

<h1>Student Registration Form</h1>

<form>

<div class="input-box">
<label>Student Name</label>
<input type="text" required>
</div>

<br>

<div class="row">

<div class="input-box">
<label>Mobile No.</label>
<input type="tel">
</div>

<div class="input-box">
<label>Email Id</label>
<input type="email">
</div>

</div>

<div class="row">

<div class="input-box">
<label>Father Name</label>
<input type="text">
</div>

<div class="input-box">
<label>Mother Name</label>
<input type="text">
</div>

</div>

<div class="row">

<div class="input-box">
<label>Select Course</label>

<select>
<option>Select...</option>
<option>BCA</option>
<option>B.Tech</option>
<option>B.Sc</option>
<option>B.Com</option>
<option>MCA</option>
</select>

</div>

<div class="input-box">
<label>Date Of Birth</label>
<input type="date">
</div>

</div>

<div class="row">

<div class="input-box">
<label>Gender</label>

<div class="gender">
<label><input type="radio" name="gender"> Male</label>
<label><input type="radio" name="gender"> Female</label>
</div>

</div>

<div class="input-box">
<label>Student Photo</label>
<input type="file">
</div>

</div>

<div class="input-box">
<label>Select Branch</label>

<div class="branch">
<label><input type="checkbox"> CSE</label>
<label><input type="checkbox"> IT</label>
<label><input type="checkbox"> ECE</label>
<label><input type="checkbox"> Civil</label>
</div>

</div>

<br>

<div class="input-box">
<label>Address</label>
<textarea rows="6"></textarea>
</div>

<br>

<button type="submit">Submit</button>

</form>

</div>

</body>
</html>
